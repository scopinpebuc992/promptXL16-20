<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4e79"/>
      <stop offset="0.55" stop-color="#2f5597"/>
      <stop offset="1" stop-color="#14503a"/>
    </linearGradient>
    <linearGradient id="barre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#217346"/>
      <stop offset="0.5" stop-color="#e8f1fa"/>
      <stop offset="1" stop-color="#2b579a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#fond)"/>

  <!-- Grille excel stylisee en fond -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <path d="M 560 0 V 300 M 640 0 V 300 M 720 0 V 300 M 800 0 V 300 M 880 0 V 300 M 960 0 V 300 M 1040 0 V 300 M 1120 0 V 300"/>
    <path d="M 560 60 H 1200 M 560 120 H 1200 M 560 180 H 1200 M 560 240 H 1200"/>
  </g>
  <rect x="560" y="0" width="640" height="40" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="560" y="0" width="640" height="300" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>

  <!-- Logo : cube verrouille formule -->
  <g transform="translate(70,90)">
    <rect x="0" y="0" width="120" height="120" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="60" y="52" font-family="Consolas, monospace" font-size="30" font-weight="bold" fill="#9ec2e6" text-anchor="middle">VBA</text>
    <text x="60" y="86" font-family="Consolas, monospace" font-size="24" fill="#ffffff" text-anchor="middle">fx  =</text>
  </g>

  <!-- Titres -->
  <text x="230" y="105" font-family="Segoe UI, Arial" font-size="44" font-weight="700" fill="#ffffff">COPILOT PROMPTS XL</text>
  <text x="230" y="152" font-family="Segoe UI, Arial" font-size="30" font-weight="600" fill="#9ec2e6">Gestionnaire full stack — Excel &amp; Word 2016 · 2019 · 2021</text>
  <text x="230" y="196" font-family="Segoe UI, Arial" font-size="19" fill="#d8e6f3">Le copilote qui garantit que toute IA écrit du code compatible VOTRE version d'Office — pas la sienne.</text>
  <text x="230" y="232" font-family="Segoe UI, Arial" font-size="17" font-style="italic" fill="#b8d4a4">« Nous aussi, on copilote les amoureux du dev. »</text>

  <!-- Bandeau bas -->
  <rect x="0" y="280" width="1200" height="20" fill="url(#barre)"/>
  <text x="1188" y="295" font-family="Segoe UI, Arial" font-size="11" fill="#0b2540" text-anchor="end" font-weight="600">© Propriétaire — Édition locale localhost:3000</text>
</svg>
